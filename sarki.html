<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Rizo Repertuvar</title>

<style>

body{
background:#111;
color:white;
font-family:Arial, sans-serif;
padding:20px;
margin:0;
box-sizing:border-box;
}

h1{
text-align:center;
margin-bottom:15px;
display:flex;
align-items:center;
justify-content:center;
gap:12px;
}

.baglama-icon{
width:34px;
height:34px;
fill:#e5a93b;
transform:rotate(-20deg);
flex-shrink:0;
}

/* Yedekleme Butonları Çubuğu */
.backup-bar{
display:flex;
gap:10px;
justify-content:center;
margin-bottom:15px;
flex-wrap: wrap;
}

.backup-btn{
background:#333;
color:#bbb;
border:1px solid #444;
padding:8px 14px;
font-size:14px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.backup-btn:hover{
background:#444;
color:#fff;
}

/* Arama Çubuğu */
.search-box{
width:100%;
padding:14px 18px;
margin-bottom:15px;
font-size:18px;
background:#222;
color:white;
border:1px solid #444;
border-radius:12px;
box-sizing:border-box;
outline:none;
transition:border-color 0.2s;
}

.search-box:focus{
border-color:#e5a93b;
}

.song{
background:#222;
padding:18px 20px;
margin:12px 0;
border-radius:12px;
font-size:22px;
user-select:none;
cursor:pointer;
display:flex;
justify-content:space-between;
align-items:center;
}

.song:active{
background:#2a2a2a;
}

.song-title{
flex:1;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.edit-btn{
background:#333;
border:1px solid #444;
color:#bbb;
font-size:15px;
padding:6px 12px;
border-radius:8px;
cursor:pointer;
margin-left:10px;
transition:0.2s;
}

.edit-btn:hover{
background:#444;
color:#fff;
}

.add{
position:fixed;
right:25px;
bottom:25px;
width:65px;
height:65px;
border-radius:50%;
border:0;
font-size:35px;
background:#00c853;
color:white;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,0.5);
z-index: 10;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.85);
padding:20px;
overflow-y:auto;
box-sizing:border-box;
z-index: 20;
}

.box{
background:#222;
padding:20px;
border-radius:15px;
margin:50px auto 20px auto;
max-width:500px;
box-sizing:border-box;
}

/* Şarkı Sözü Okuma Modalı */
.view-box{
background:#1a1a1a;
padding:22px;
border-radius:16px;
margin:20px auto;
max-width:600px;
box-sizing:border-box;
border:1px solid #333;
}

.lyrics-text{
font-size:20px;
line-height:1.7;
white-space:pre-wrap;
word-wrap:break-word;
color:#e0e0e0;
background:#222;
padding:18px;
border-radius:12px;
margin:15px 0;
max-height:60vh;
overflow-y:auto;
}

input, textarea{
width:100%;
padding:15px;
margin-bottom:15px;
font-size:18px;
background:#333;
color:white;
border:1px solid #444;
border-radius:10px;
box-sizing:border-box;
font-family:inherit;
}

textarea{
height:160px;
resize:vertical;
}

button{
padding:15px;
border:0;
border-radius:10px;
font-size:18px;
cursor:pointer;
font-weight:bold;
}

.btn-row{
display:flex;
gap:10px;
margin-bottom:15px;
}

.btn-search{
flex:1;
background:#2979ff;
color:white;
}

.btn-paste{
flex:1;
background:#ff9100;
color:white;
}

.save{
width:100%;
background:#00c853;
color:white;
margin-bottom:10px;
}

.close{
width:100%;
background:#444;
color:white;
}

</style>

</head>


<body>

<h1>
  <!-- Bağlama Vektör İkonu -->
  <svg class="baglama-icon" viewBox="0 0 64 64">
    <rect x="29.5" y="4" width="5" height="34" rx="2.5" />
    <polygon points="28,4 36,4 35,0 29,0" />
    <circle cx="27" cy="6" r="1.5" />
    <circle cx="37" cy="6" r="1.5" />
    <circle cx="27" cy="11" r="1.5" />
    <circle cx="37" cy="11" r="1.5" />
    <circle cx="27" cy="16" r="1.5" />
    <circle cx="37" cy="16" r="1.5" />
    <path d="M22,34 C16,39 15,50 19,57 C23,63 41,63 45,57 C49,50 48,39 42,34 Z" />
    <ellipse cx="32" cy="46" rx="3.5" ry="3.5" fill="#111" />
    <rect x="28" y="55" width="8" height="2" rx="1" fill="#111" />
  </svg>
  <span>Hasan Altun Repertuvar</span>
</h1>

<!-- Yedekleme Çubuğu -->
<div class="backup-bar">
  <button class="backup-btn" onclick="exportBackup()">💾 Dijital Yedek (JSON)</button>
  <button class="backup-btn" onclick="exportTextBackup()">📄 Wordpad/Yazı İndir (TXT)</button>
  <button class="backup-btn" onclick="document.getElementById('importFile').click()">📂 Yedek Yükle</button>
  <input type="file" id="importFile" accept=".json,.txt" style="display:none" onchange="importBackup(event)">
</div>

<!-- Arama Çubuğu -->
<input type="text" id="searchInput" class="search-box" placeholder="🔍 Eser adı ara..." oninput="render()">

<div id="list"></div>

<button class="add" onclick="openAdd()">+</button>

<!-- 1. EKLE / DÜZENLE MODALI -->
<div class="modal" id="modal" onclick="closeModalOnBg(event)">
  <div class="box">
    <h2 id="modal-title">Yeni Eser</h2>
    <input id="title" placeholder="Eser / Sanatçı adı">
    <div class="btn-row">
      <button type="button" class="btn-search" onclick="searchLyricsOnline()">🌐 Web'de Ara</button>
      <button type="button" class="btn-paste" onclick="pasteFromClipboard()">📋 Yapıştır</button>
    </div>
    <textarea id="lyrics" placeholder="Sözler buraya gelecek..."></textarea>
    <button class="save" onclick="saveSong()">Kaydet</button>
    <button type="button" class="close" onclick="closeAdd()">Vazgeç</button>
  </div>
</div>

<!-- 2. ŞARKI SÖZÜ OKUMA PENCERESİ (YENİ) -->
<div class="modal" id="viewModal" onclick="closeViewModalOnBg(event)">
  <div class="view-box">
    <h2 id="viewTitle" style="margin-top:0; color:#e5a93b; text-align:center;"></h2>
    <div class="lyrics-text" id="viewLyrics"></div>
    <button type="button" class="close" onclick="closeViewSong()">⬅ Geri Dön</button>
  </div>
</div>

<script>

let songs = JSON.parse(localStorage.getItem("songs")) || [];
let editIndex = null;

function sortSongs(){
  songs.sort((a, b) => (a.title || "").localeCompare(b.title || "", "tr", { sensitivity: "base" }));
}

function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";

  sortSongs();

  let query = (document.getElementById("searchInput")?.value || "").toLocaleLowerCase("tr").trim();

  let filtered = songs.map((s, originalIndex) => ({ ...s, originalIndex }))
                      .filter(s => (s.title || "").toLocaleLowerCase("tr").includes(query));

  if(songs.length === 0){
    list.innerHTML = "<p style='text-align:center;color:#666;margin-top:40px;'>Repertuvar henüz boş. '+' butonuyla eser ekleyebilirsin.</p>";
    return;
  }

  if(filtered.length === 0){
    list.innerHTML = "<p style='text-align:center;color:#666;margin-top:40px;'>Eşleşen eser bulunamadı.</p>";
    return;
  }

  filtered.forEach(item => {
    let i = item.originalIndex;
    let div = document.createElement("div");
    div.className = "song";

    let titleSpan = document.createElement("span");
    titleSpan.className = "song-title";
    titleSpan.innerText = item.title;

    let editBtn = document.createElement("button");
    editBtn.className = "edit-btn";
    editBtn.innerText = "✏️ Düzenle";
    editBtn.onclick = function(e){
      e.stopPropagation();
      openEdit(i);
    };

    div.appendChild(titleSpan);
    div.appendChild(editBtn);

    div.onclick = function(){
      openViewSong(i);
    };

    let timer;

    div.onmousedown = function(){
      timer = setTimeout(() => {
        if(confirm(item.title + " silinsin mi?")){
          songs.splice(i, 1);
          localStorage.setItem("songs", JSON.stringify(songs));
          render();
        }
      }, 700);
    };

    div.onmouseup = function(){
      clearTimeout(timer);
    };

    div.ontouchstart = function(){
      timer = setTimeout(() => {
        if(confirm(item.title + " silinsin mi?")){
          songs.splice(i, 1);
          localStorage.setItem("songs", JSON.stringify(songs));
          render();
        }
      }, 700);
    };

    div.ontouchend = function(){
      clearTimeout(timer);
    };

    list.appendChild(div);
  });
}

function openViewSong(index){
  let song = songs[index];
  if(!song) return;
  document.getElementById("viewTitle").innerText = song.title;
  document.getElementById("viewLyrics").innerText = song.lyrics || "(Bu esere ait söz eklenmemiş)";
  document.getElementById("viewModal").style.display = "block";
}

function closeViewSong(){
  document.getElementById("viewModal").style.display = "none";
}

function closeViewModalOnBg(e){
  if(e.target.id === "viewModal"){
    closeViewSong();
  }
}

function openAdd(){
  editIndex = null;
  document.getElementById("modal-title").innerText = "Yeni Eser";
  document.getElementById("title").value = "";
  document.getElementById("lyrics").value = "";
  document.getElementById("modal").style.display = "block";
  document.getElementById("title").focus();
}

function openEdit(index){
  editIndex = index;
  document.getElementById("modal-title").innerText = "Eseri Düzenle";
  document.getElementById("title").value = songs[index].title;
  document.getElementById("lyrics").value = songs[index].lyrics || "";
  document.getElementById("modal").style.display = "block";
  document.getElementById("title").focus();
}

function closeAdd(){
  document.getElementById("modal").style.display = "none";
  document.getElementById("title").value = "";
  document.getElementById("lyrics").value = "";
  editIndex = null;
}

function closeModalOnBg(e){
  if(e.target.id === "modal"){
    closeAdd();
  }
}

function searchLyricsOnline(){
  let title = document.getElementById("title").value.trim();
  if(!title){
    alert("Lütfen önce aratmak istediğin şarkının adını yaz.");
    return;
  }
  let query = encodeURIComponent(title + " şarkı sözleri");
  window.open("https://www.google.com/search?q=" + query, "_blank");
}

async function pasteFromClipboard(){
  try {
    const text = await navigator.clipboard.readText();
    if(text){
      document.getElementById("lyrics").value = text;
    }
  } catch (err) {
    alert("Pano erişimine izin verin veya doğrudan kutuya basılı tutup yapıştırın.");
  }
}

function saveSong(){
  let title = document.getElementById("title").value.trim();
  let lyrics = document.getElementById("lyrics").value.trim();

  if(!title){
    alert("Lütfen bir eser adı girin.");
    return;
  }

  if(editIndex !== null){
    songs[editIndex].title = title;
    songs[editIndex].lyrics = lyrics;
  } else {
    songs.push({ title, lyrics });
  }

  sortSongs();
  localStorage.setItem("songs", JSON.stringify(songs));
  closeAdd();
  render();
}

// iPhone Safari Uyumlu Dijital Yedek İndirme (JSON)
async function exportBackup() {
  if (songs.length === 0) {
    alert("İndirilecek kayıtlı eser bulunamadı.");
    return;
  }

  sortSongs();
  const jsonStr = JSON.stringify(songs, null, 2);
  const fileName = "hasan_altun_repertuvar_" + new Date().toISOString().slice(0, 10) + ".json";
  const blob = new Blob([jsonStr], { type: "application/json" });
  const file = new File([blob], fileName, { type: "application/json" });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({
        files: [file],
        title: "Hasan Altun Repertuvar Yedeği",
        text: "Hasan Altun Repertuvar yedek dosyam"
      });
      return;
    } catch (err) {
      if (err.name !== "AbortError") {
        console.log("Paylaşım iptal edildi veya desteklenmedi.");
      }
    }
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();

  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 1500);
}

// 📄 Wordpad / Not Defteri Uyumlu Düz Metin İndirme (TXT)
function exportTextBackup() {
  if (songs.length === 0) {
    alert("İndirilecek kayıtlı eser bulunamadı.");
    return;
  }

  sortSongs();
  let textContent = "HASAN ALTUN REPERTUVAR LİSTESİ\n";
  textContent += "========================================\n\n";

  songs.forEach((song, index) => {
    textContent += `${index + 1}. ${song.title}\n`;
    textContent += "----------------------------------------\n";
    textContent += (song.lyrics || "(Bu esere ait söz eklenmemiş)") + "\n\n\n";
  });

  const fileName = "hasan_altun_repertuvar_" + new Date().toISOString().slice(0, 10) + ".txt";
  const blob = new Blob([textContent], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();

  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 1500);
}

// İndirilen Yedeği Geri Yükle (Hem JSON hem TXT destekler)
function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const content = e.target.result;
      
      // JSON dosyası ise
      if(file.name.endsWith('.json') || content.trim().startsWith('[')){
        const importedSongs = JSON.parse(content);
        if(Array.isArray(importedSongs)){
          if(confirm("Mevcut listenin üzerine bu yedek yüklensin mi?")){
            songs = importedSongs;
            sortSongs();
            localStorage.setItem("songs", JSON.stringify(songs));
            render();
            alert("Repertuvar başarıyla geri yüklendi!");
          }
        } else {
          alert("Geçersiz yedek dosyası formatı.");
        }
      } 
      // TXT dosyası ise (Bilgilendirme amaçlı)
      else {
        alert("Metin dosyaları (.txt) doğrudan toplu şarkı aktarımı için uygun değildir. Lütfen daha önce indirdiğiniz '.json' uzantılı yedek dosyasını seçin.");
      }
    } catch(err) {
      alert("Dosya okunurken bir hata oluştu.");
    }
  };
  reader.readAsText(file);
}

render();

</script>

</body>
</html>
