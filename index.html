<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Repertuvarım</title>

<style>

body{
background:#111;
color:white;
font-family:Arial, sans-serif;
padding:20px;
margin:0;
box-sizing:border-box;
}

h1{
text-align:center;
margin-bottom:15px;
}

/* Yedekleme Butonları Çubuğu */
.backup-bar{
display:flex;
gap:10px;
justify-content:center;
margin-bottom:20px;
}

.backup-btn{
background:#333;
color:#bbb;
border:1px solid #444;
padding:8px 14px;
font-size:14px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.backup-btn:hover{
background:#444;
color:#fff;
}

.song{
background:#222;
padding:18px 20px;
margin:12px 0;
border-radius:12px;
font-size:22px;
user-select:none;
cursor:pointer;
display:flex;
justify-content:space-between;
align-items:center;
}

.song:active{
background:#2a2a2a;
}

.song-title{
flex:1;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.edit-btn{
background:#333;
border:1px solid #444;
color:#bbb;
font-size:16px;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
margin-left:10px;
transition:0.2s;
}

.edit-btn:hover{
background:#444;
color:#fff;
}

.add{
position:fixed;
right:25px;
bottom:25px;
width:65px;
height:65px;
border-radius:50%;
border:0;
font-size:35px;
background:#00c853;
color:white;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,0.5);
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.8);
padding:20px;
overflow-y:auto;
box-sizing:border-box;
}

.box{
background:#222;
padding:20px;
border-radius:15px;
margin:50px auto 20px auto;
max-width:500px;
box-sizing:border-box;
}

input, textarea{
width:100%;
padding:15px;
margin-bottom:15px;
font-size:18px;
background:#333;
color:white;
border:1px solid #444;
border-radius:10px;
box-sizing:border-box;
font-family:inherit;
}

textarea{
height:160px;
resize:vertical;
}

button{
padding:15px;
border:0;
border-radius:10px;
font-size:18px;
cursor:pointer;
font-weight:bold;
}

.btn-row{
display:flex;
gap:10px;
margin-bottom:15px;
}

.btn-search{
flex:1;
background:#2979ff;
color:white;
}

.btn-paste{
flex:1;
background:#ff9100;
color:white;
}

.save{
width:100%;
background:#00c853;
color:white;
margin-bottom:10px;
}

.close{
width:100%;
background:#444;
color:white;
}

</style>

</head>


<body>

<h1>🎸 Repertuvarım</h1>

<!-- Yedekleme Araç Çubuğu -->
<div class="backup-bar">
  <button class="backup-btn" onclick="exportBackup()">💾 Yedeği İndir (JSON)</button>
  <button class="backup-btn" onclick="document.getElementById('importFile').click()">📂 Yedek Yükle</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(event)">
</div>

<div id="list"></div>

<button class="add" onclick="openAdd()">+</button>

<div class="modal" id="modal" onclick="closeModalOnBg(event)">

<div class="box">

<h2 id="modal-title">Yeni Eser</h2>

<input id="title" placeholder="Eser / Sanatçı adı">

<div class="btn-row">
  <button type="button" class="btn-search" onclick="searchLyricsOnline()">🌐 Web'de Ara</button>
  <button type="button" class="btn-paste" onclick="pasteFromClipboard()">📋 Yapıştır</button>
</div>

<textarea id="lyrics" placeholder="Sözler buraya gelecek..."></textarea>

<button class="save" onclick="saveSong()">Kaydet</button>
<button type="button" class="close" onclick="closeAdd()">Vazgeç</button>

</div>

</div>

<script>

let songs = JSON.parse(localStorage.getItem("songs")) || [];
let editIndex = null;

function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";

  if(songs.length === 0){
    list.innerHTML = "<p style='text-align:center;color:#666;margin-top:40px;'>Repertuvar henüz boş. '+' butonuyla eser ekleyebilirsin.</p>";
    return;
  }

  songs.forEach((s, i) => {
    let div = document.createElement("div");
    div.className = "song";

    // Şarkı adı alanı
    let titleSpan = document.createElement("span");
    titleSpan.className = "song-title";
    titleSpan.innerText = s.title;

    // Düzenle butonu
    let editBtn = document.createElement("button");
    editBtn.className = "edit-btn";
    editBtn.innerText = "✏️ Düzenle";
    editBtn.onclick = function(e){
      e.stopPropagation();
      openEdit(i);
    };

    div.appendChild(titleSpan);
    div.appendChild(editBtn);

    // Tıklama ile detay sayfasına gitme
    div.onclick = function(){
      location.href = "sarki.html?id=" + i;
    };

    // Uzun basma ile silme kontrolü
    let timer;

    div.onmousedown = function(){
      timer = setTimeout(() => {
        if(confirm(s.title + " silinsin mi?")){
          songs.splice(i, 1);
          localStorage.setItem("songs", JSON.stringify(songs));
          render();
        }
      }, 700);
    };

    div.onmouseup = function(){
      clearTimeout(timer);
    };

    div.ontouchstart = function(){
      timer = setTimeout(() => {
        if(confirm(s.title + " silinsin mi?")){
          songs.splice(i, 1);
          localStorage.setItem("songs", JSON.stringify(songs));
          render();
        }
      }, 700);
    };

    div.ontouchend = function(){
      clearTimeout(timer);
    };

    list.appendChild(div);
  });
}

function openAdd(){
  editIndex = null;
  document.getElementById("modal-title").innerText = "Yeni Eser";
  document.getElementById("title").value = "";
  document.getElementById("lyrics").value = "";
  document.getElementById("modal").style.display = "block";
  document.getElementById("title").focus();
}

function openEdit(index){
  editIndex = index;
  document.getElementById("modal-title").innerText = "Eseri Düzenle";
  document.getElementById("title").value = songs[index].title;
  document.getElementById("lyrics").value = songs[index].lyrics || "";
  document.getElementById("modal").style.display = "block";
  document.getElementById("title").focus();
}

function closeAdd(){
  document.getElementById("modal").style.display = "none";
  document.getElementById("title").value = "";
  document.getElementById("lyrics").value = "";
  editIndex = null;
}

function closeModalOnBg(e){
  if(e.target.id === "modal"){
    closeAdd();
  }
}

function searchLyricsOnline(){
  let title = document.getElementById("title").value.trim();
  if(!title){
    alert("Lütfen önce aratmak istediğin şarkının adını yaz.");
    return;
  }
  let query = encodeURIComponent(title + " şarkı sözleri");
  window.open("https://www.google.com/search?q=" + query, "_blank");
}

async function pasteFromClipboard(){
  try {
    const text = await navigator.clipboard.readText();
    if(text){
      document.getElementById("lyrics").value = text;
    }
  } catch (err) {
    alert("Pano erişimine izin verin veya doğrudan kutuya basılı tutup yapıştırın.");
  }
}

function saveSong(){
  let title = document.getElementById("title").value.trim();
  let lyrics = document.getElementById("lyrics").value.trim();

  if(!title){
    alert("Lütfen bir eser adı girin.");
    return;
  }

  if(editIndex !== null){
    songs[editIndex].title = title;
    songs[editIndex].lyrics = lyrics;
  } else {
    songs.push({ title, lyrics });
  }

  localStorage.setItem("songs", JSON.stringify(songs));
  closeAdd();
  render();
}

// 💾 iPhone & Safari Uyumlu Yedek İndirme (Paylaş / Dosyalara Kaydet)
async function exportBackup() {
  if (songs.length === 0) {
    alert("İndirilecek kayıtlı eser bulunamadı.");
    return;
  }

  const jsonStr = JSON.stringify(songs, null, 2);
  const fileName = "repertuvar_yedek_" + new Date().toISOString().slice(0, 10) + ".json";
  const blob = new Blob([jsonStr], { type: "application/json" });
  const file = new File([blob], fileName, { type: "application/json" });

  // 1. iPhone Paylaşım Menüsü (Dosyalara Kaydet / AirDrop / WhatsApp)
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({
        files: [file],
        title: "Repertuvar Yedeği",
        text: "Repertuvar yedek dosyam"
      });
      return;
    } catch (err) {
      if (err.name !== "AbortError") {
        console.log("Paylaşım iptal edildi veya desteklenmedi.");
      }
    }
  }

  // 2. Doğrudan İndirme Fallback
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();

  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 1500);
}

// 📂 İndirilen Yedeği Geri Yükle (Import)
function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const importedSongs = JSON.parse(e.target.result);
      if(Array.isArray(importedSongs)){
        if(confirm("Mevcut listenin üzerine bu yedek yüklensin mi?")){
          songs = importedSongs;
          localStorage.setItem("songs", JSON.stringify(songs));
          render();
          alert("Repertuvar başarıyla geri yüklendi!");
        }
      } else {
        alert("Geçersiz yedek dosyası formatı.");
      }
    } catch(err) {
      alert("Dosya okunurken bir hata oluştu.");
    }
  };
  reader.readAsText(file);
}

render();

</script>

</body>
</html>
